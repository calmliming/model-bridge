name: model-bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: model-bridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-model_bridge}
      POSTGRES_USER: ${PG_USER:-model_bridge}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      # PostgreSQL data — back this up to preserve accounts, API keys, and usage logs.
      - ./data/pg:/var/lib/postgresql/data
    ports:
      # Bind to loopback only; remote access goes through an SSH tunnel.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-model_bridge} -d ${PG_DATABASE:-model_bridge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  model-bridge:
    build:
      context: .
      target: runtime
    image: model-bridge:latest
    container_name: model-bridge
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Dashboard + relay API.
      - "3001:3000"
      # OAuth callback for OpenAI (/auth/callback) and Google (/oauth2callback).
      # The browser doing the auth flow must reach this port; keep it on
      # localhost if the host is remote and you SSH-tunnel from your laptop.
      - "1455:1455"
    extra_hosts:
      # Lets the app container reach services published on the Docker host, e.g.
      # a Redis instance managed by 1Panel outside this compose project.
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${PG_USER:-model_bridge}:${PG_PASSWORD}@postgres:5432/${PG_DATABASE:-model_bridge}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      UPDATER_URL: http://model-bridge-updater:3002
      UPDATE_TOKEN: ${UPDATE_TOKEN:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:-}
      STICKY_SESSION_WAIT_MS: ${STICKY_SESSION_WAIT_MS:-15000}
    volumes:
      # Mounted so migrate-to-pg.sh can read the legacy SQLite backup via
      # scripts/migrate-sqlite-to-pg.ts. The app itself no longer reads or
      # writes here — PostgreSQL data lives under ./data/pg in its own
      # service. Read-write because SQLite WAL mode needs to create
      # sidecar -shm/-wal files even when opened readonly.
      - ./data:/app/data

  model-bridge-updater:
    build:
      context: .
      target: updater
    image: model-bridge-updater:latest
    container_name: model-bridge-updater
    restart: unless-stopped
    environment:
      UPDATE_TOKEN: ${UPDATE_TOKEN:-}
      REPO_DIR: /repo
      UPDATER_PORT: 3002
      UPDATE_REMOTE: ${UPDATE_REMOTE:-origin}
      UPDATE_BRANCH: ${UPDATE_BRANCH:-main}
      UPDATE_SERVICE: model-bridge
    volumes:
      # Internal updater needs the host repository and Docker socket to run
      # the fixed git + docker compose update flow. It is not exposed publicly.
      - ./:/repo
      - /var/run/docker.sock:/var/run/docker.sock
